<!DOCTYPE html>
<html>
<head>
  <title>Rider & Driver Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <style>
    #map { height: 600px }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([22.5354441, 88.0354893], 13);

  // Add OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Custom Icons
  const riderIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/128/2491/2491929.png',
    iconSize: [40, 40],
    iconAnchor: [20, 40],
  });

  const driverIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/4900/4900915.png',
    iconSize: [40, 40],
    iconAnchor: [20, 40],
  });

  // Fetch rider and driver location
  fetch('/api/location/get-all/')
    .then(response => response.json())
    .then(data => {
      if (data.rider.lat && data.rider.lng) {
        L.marker([data.rider.lat, data.rider.lng], { icon: riderIcon })
          .addTo(map)
          .bindPopup("Rider");
      }

      if (data.driver.lat && data.driver.lng) {
        L.marker([data.driver.lat, data.driver.lng], { icon: driverIcon })
          .addTo(map)
          .bindPopup("Driver");
      }
    })
    .catch(error => {
      console.error("Error fetching locations:", error);
    });
</script>

</body>
</html>
